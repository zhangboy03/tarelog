name: Bug report
description: Report a reproducible problem in Tarelog.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Tarelog. Remove tokens, food photos, and personal nutrition data before posting.
  - type: checkboxes
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include the smallest sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    attributes:
      label: Commit or version
      placeholder: main at abc1234
  - type: input
    attributes:
      label: Runtime
      placeholder: Node 22, browser, deployment target
  - type: textarea
    attributes:
      label: Sanitized logs
      render: shell
